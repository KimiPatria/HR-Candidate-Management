[project]
name = "ai-interviewer-backend"
version = "0.1.0"
description = "AI Candidate Interviewer - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Client side of the Seed ASR/TTS WebSocket legs (VOICE_MODE=local). Arrives via
    # uvicorn[standard] too, but app code imports it directly so it is declared here.
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "email-validator>=2.2",
    # Local, offline document embeddings for the RAG vector store (ONNX runtime, no
    # torch/GPU needed). See app/services/embeddings.py.
    "fastembed>=0.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
# One-time avatar training only (scripts/train_avatar.py) - not used by the running app.
avatar = ["byteplus-sdk>=1.0.53"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
